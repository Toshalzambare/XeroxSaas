apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: xerox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
      - name: ghcr-login-secret
      containers:
      - name: backend
        image: ghcr.io/toshalzambare/anti-print-backend:sha-a10ff7e
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: razorpay-secret
        - secretRef:
            name: jwt-secret
        - secretRef:
            name: google-auth-secret
        resources:
          limits:
            memory: 1Gi
            cpu: 1
          requests:
            memory: 512Mi
            cpu: 500m
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: xerox
spec:
  ports:
  - port: 5000
    targetPort: 5000
  selector:
    app: backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: xerox
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: xerox
data:
  NODE_ENV: "production"
  PORT: "5000"
  CLIENT_URL: "http://localhost"
  MONGO_URI: "mongodb://mongodb.xerox.svc.cluster.local:27017/xeroxsaas"
  REDIS_URL: "redis://redis.xerox.svc.cluster.local:6379"
  MINIO_ENDPOINT: "http://minio.xerox.svc.cluster.local:9000"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin"
  S3_FORCE_PATH_STYLE: "true"
  # Secrets like JWT_SECRET will be injected via SealedSecrets later
