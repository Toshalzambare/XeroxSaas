apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xerox-ingress
  namespace: xerox
  annotations:
    # Removed rewrite-target: / because backend routes natively include /api
spec:
  ingressClassName: nginx
  rules:
  - host: localhost
    http:
      paths:
      # Route /api to Backend
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 5000
      # Route everything else to Frontend
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
